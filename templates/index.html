<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="app-container">
        <!-- Sidebar / Player info -->
        <aside class="player-panel glass-panel">
            <div class="album-art">
                <div class="disc">
                    <i class="fas fa-music"></i>
                </div>
            </div>
            <div class="current-track-info">
                <h2 id="current-title">Not Playing</h2>
                <p id="current-artist">...</p>
            </div>
            
            <div class="controls">
                <button id="btn-prev" class="control-btn" title="Previous"><i class="fas fa-backward-step"></i></button>
                <button id="btn-play" class="control-btn play-btn" title="Play/Pause"><i class="fas fa-play"></i></button>
                <button id="btn-next" class="control-btn" title="Next"><i class="fas fa-forward-step"></i></button>
            </div>
        </aside>

        <!-- Playlist View -->
        <main class="playlist-panel glass-panel">
            <header>
                <h1>My Playlist</h1>
                <span class="badge" id="song-count">0 songs</span>
            </header>
            
            <div class="add-song-container">
                <form id="add-song-form">
                    <input type="text" id="input-title" placeholder="Song title..." required>
                    <input type="text" id="input-artist" placeholder="Artist name..." required>
                    <button type="submit" class="add-btn"><i class="fas fa-plus"></i> Add</button>
                </form>
            </div>

            <div class="playlist-container">
                <ul id="playlist-ul">
                    <!-- Songs injected by JS -->
                </ul>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
