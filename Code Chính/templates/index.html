<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --hover-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Left Side: Now Playing & Controls */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 2.2rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .now-playing-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .now-playing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3);
        }

        .now-playing-badge {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(236, 72, 153, 0.2);
            color: #fbcfe8;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .now-playing-badge i {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .record-disk {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #333 10%, #111 40%, #222 80%);
            border-radius: 50%;
            margin: 2.5rem auto 1.5rem;
            border: 4px solid var(--glass-border);
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            animation: spin 4s linear infinite;
        }

        .record-disk::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: var(--primary-gradient);
            border-radius: 50%;
            border: 2px solid #000;
        }

        .record-disk.paused {
            animation-play-state: paused;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .song-info h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .song-info p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .btn-control:hover {
            background: var(--primary-gradient);
            border-color: transparent;
            transform: scale(1.1);
        }

        .btn-control:active {
            transform: scale(0.95);
        }

        /* Right Side: Playlist & Add Song */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .add-song-form {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .add-song-form h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-add {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .playlist-container {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 400px;
        }

        .playlist-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .playlist-header h3 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .song-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .playlist-list {
            list-style: none;
            overflow-y: auto;
            padding: 0.5rem;
        }

        /* Custom Scrollbar */
        .playlist-list::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .playlist-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: var(--hover-bg);
        }

        .playlist-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .playlist-item.active .item-title {
            color: var(--accent);
            font-weight: 500;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            flex-grow: 1;
        }

        .item-title {
            font-size: 1rem;
            color: var(--text-main);
        }

        .item-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .playing-icon {
            display: none;
            color: var(--accent);
        }

        .playlist-item.active .playing-icon {
            display: block;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .empty-state {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success i {
            color: #22c55e;
        }

        .toast.error i {
            color: #ef4444;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="header">
                <h1>MusicFlow</h1>
                <p>Your beautiful playlist manager</p>
            </div>

            <div class="now-playing-card" id="nowPlayingCard">
                <div class="now-playing-badge" id="nowPlayingBadge">
                    <i class="fas fa-music"></i> Now Playing
                </div>

                <div class="record-disk paused" id="recordDisk"></div>

                <div class="song-info">
                    <h2 id="currentTitle">Not Playing</h2>
                    <p id="currentArtist">Select a song</p>
                </div>

                <div class="controls">
                    <button class="btn-control" id="btnPrev" title="Previous Song">
                        <i class="fas fa-backward-step"></i>
                    </button>
                    <button class="btn-control" id="btnNext" title="Next Song">
                        <i class="fas fa-forward-step"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="add-song-form">
                <h3><i class="fas fa-plus-circle"></i> Add New Song</h3>
                <form id="addForm">
                    <div class="form-group">
                        <input type="text" id="inputTitle" placeholder="Song Title" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="inputArtist" placeholder="Artist Name" required>
                    </div>
                    <button type="submit" class="btn-add">
                        <i class="fas fa-plus"></i> Add to Playlist
                    </button>
                </form>
            </div>

            <div class="playlist-container">
                <div class="playlist-header">
                    <h3><i class="fas fa-list-ul"></i> Queue</h3>
                    <span class="song-count" id="songCount">0 songs</span>
                </div>
                <ul class="playlist-list" id="playlistList">
                    <!-- Playlist items will be generated here -->
                </ul>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Action successful</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchPlaylist();

            document.getElementById('addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('inputTitle').value;
                const artist = document.getElementById('inputArtist').value;

                try {
                    const res = await fetch('/api/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, artist })
                    });
                    const data = await res.json();

                    if (data.success) {
                        document.getElementById('inputTitle').value = '';
                        document.getElementById('inputArtist').value = '';
                        updateUI(data.data);
                        showToast('Song added successfully', 'success');
                    } else {
                        showToast(data.error || 'Failed to add song', 'error');
                    }
                } catch (err) {
                    showToast('Network error', 'error');
                }
            });

            document.getElementById('btnNext').addEventListener('click', async () => {
                try {
                    const res = await fetch('/api/next', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) updateUI(data.data);
                } catch (err) {
                    console.error(err);
                }
            });

            document.getElementById('btnPrev').addEventListener('click', async () => {
                try {
                    const res = await fetch('/api/prev', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) updateUI(data.data);
                } catch (err) {
                    console.error(err);
                }
            });
        });

        async function fetchPlaylist() {
            try {
                const res = await fetch('/api/playlist');
                const data = await res.json();
                updateUI(data);
            } catch (err) {
                console.error("Failed to fetch playlist", err);
            }
        }

        async function deleteSong(title) {
            try {
                const res = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });
                const data = await res.json();
                if (data.success) {
                    updateUI(data.data);
                    showToast('Song removed', 'success');
                } else {
                    showToast('Failed to remove song', 'error');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function updateUI(data) {
            const listEl = document.getElementById('playlistList');
            const currentTitleEl = document.getElementById('currentTitle');
            const currentArtistEl = document.getElementById('currentArtist');
            const songCountEl = document.getElementById('songCount');
            const recordDisk = document.getElementById('recordDisk');
            const badge = document.getElementById('nowPlayingBadge');

            songCountEl.textContent = `${data.size} song${data.size !== 1 ? 's' : ''}`;

            listEl.innerHTML = '';

            let hasCurrent = false;

            if (data.songs.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Your playlist is empty. Add some tunes!</div>';
                currentTitleEl.textContent = 'Playlist Empty';
                currentArtistEl.textContent = '-';
                recordDisk.classList.add('paused');
                badge.style.display = 'none';
                return;
            }

            badge.style.display = 'flex';

            data.songs.forEach(song => {
                const li = document.createElement('li');
                li.className = `playlist-item ${song.is_current ? 'active' : ''}`;

                if (song.is_current) {
                    hasCurrent = true;
                    currentTitleEl.textContent = song.title;
                    currentArtistEl.textContent = song.artist;
                    recordDisk.classList.remove('paused');
                }

                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${escapeHTML(song.title)}</span>
                        <span class="item-artist">${escapeHTML(song.artist)}</span>
                    </div>
                    <div class="item-actions">
                        <i class="fas fa-chart-simple playing-icon"></i>
                        <button class="btn-delete" onclick="deleteSong('${escapeHTML(song.title)}')" title="Remove">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            if (!hasCurrent && data.songs.length > 0) {
                currentTitleEl.textContent = 'Not Playing';
                currentArtistEl.textContent = 'Select a song or use next/prev';
                recordDisk.classList.add('paused');
                badge.style.display = 'none';
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        let toastTimeout;
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const icon = toast.querySelector('i');

            toast.className = `toast ${type}`;
            toastMsg.textContent = msg;

            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
            } else {
                icon.className = 'fas fa-exclamation-circle';
            }

            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>

</html>
